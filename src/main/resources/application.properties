spring.application.name=api

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 browser console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Server
server.port=8080

# Pretty JSON
spring.jackson.serialization.indent_output=true

# Logging
logging.level.com.example=DEBUG

# Only show your own API paths in Swagger
springdoc.paths-to-match=/api/**,/health

# JWT config - change the secret in production, make it long and random
jwt.secret=your-super-secret-key-that-is-at-least-32-characters-long
jwt.expiration=86400000
# 86400000ms = 24 hours